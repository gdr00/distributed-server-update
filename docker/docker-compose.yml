volumes:
  server-bin:
  go-module-cache:

services:
  builder:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - server-bin:/output
    command: cp /app/server /output/server

  node1-init:
    image: alpine:latest
    user: "1000:1000"
    command: sh -c "rm -rf /data/crdt && /app/server init --config=/config/cfg.json"
    volumes:
      - server-bin:/app
      - ../tests/testdata/node1:/data
      - ../tests/testdata/node1/config:/config
    depends_on:
      builder:
        condition: service_completed_successfully

  node2-init:
    image: alpine:latest
    user: "1000:1000"
    command: sh -c "rm -rf /data/crdt && /app/server init --empty --config=/config/cfg.json"
    volumes:
      - server-bin:/app
      - ../tests/testdata/node2:/data
      - ../tests/testdata/node2/config:/config
    depends_on:
      builder:
        condition: service_completed_successfully

  node3-init:
    image: alpine:latest
    user: "1000:1000"
    command: sh -c "rm -rf /data/crdt && /app/server init --empty --config=/config/cfg.json"
    volumes:
      - server-bin:/app
      - ../tests/testdata/node3:/data
      - ../tests/testdata/node3/config:/config
    depends_on:
      builder:
        condition: service_completed_successfully

  node1:
    image: alpine:latest
    user: "1000:1000"
    command: /app/server --config=/config/cfg.json
    container_name: node1
    restart: on-failure
    ports:
      - "9001:9000"
    volumes:
      - server-bin:/app
      - ../tests/testdata/node1:/data
      - ../tests/testdata/node1/config:/config
    depends_on:
      node1-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 2>/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  node2:
    image: alpine:latest
    user: "1000:1000"
    command: /app/server --config=/config/cfg.json
    container_name: node2
    restart: on-failure
    ports:
      - "9002:9000"
    volumes:
      - server-bin:/app
      - ../tests/testdata/node2:/data
      - ../tests/testdata/node2/config:/config
    depends_on:
      node2-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 2>/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  node3:
    image: alpine:latest
    user: "1000:1000"
    command: /app/server --config=/config/cfg.json
    container_name: node3
    restart: on-failure
    ports:
      - "9003:9000"
    volumes:
      - server-bin:/app
      - ../tests/testdata/node3:/data
      - ../tests/testdata/node3/config:/config
    depends_on:
      node3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 2>/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.testrunner
    user: "1000:1000"
    group_add:
      - "961"
    working_dir: /src
    volumes:
      - ../go.mod:/src/go.mod:ro
      - ../go.sum:/src/go.sum:ro
      - ../internal:/src/internal:ro
      - ../tests/system:/src/tests/system:ro
      - ../tests/testdata/node1/crdt/:/data/node1_crdt:rw
      - ../tests/testdata/node2/crdt/:/data/node2_crdt:rw
      - ../tests/testdata/node3/crdt/:/data/node3_crdt:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - go-module-cache:/go/pkg/mod
    environment:
      - NODE1_ADDR=node1:9000
      - NODE2_ADDR=node2:9000
      - NODE3_ADDR=node3:9000
      - NODE1_CONTAINER=node1
      - NODE2_CONTAINER=node2
      - NODE3_CONTAINER=node3
      - NODE1_CRDT_DIR=/data/node1_crdt
      - NODE2_CRDT_DIR=/data/node2_crdt
      - NODE3_CRDT_DIR=/data/node3_crdt
      - GOFLAGS=-mod=mod
      - GOCACHE=/tmp/go-build
    command: go test ./tests/system/... -v -count=1 -timeout 180s
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
